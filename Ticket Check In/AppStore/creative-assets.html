<!doctype html>
<!--
  App Store creative assets: product page header and search results art.
  Rendered to PNG by render-creative-assets.sh at exact pixel sizes:
    ?asset=header  3840 x 1646 (21:9)
    ?asset=search  3840 x 2560 (3:2)
  The hero sits inside Apple's central "art safe area" for each canvas; the
  edges are background-only tickets, so any crop the App Store applies still
  reads. Deliberately plain: one level ticket, no background clutter. No text: the store overlays the app name and Get button itself.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #0c0f24; overflow: hidden; }
  svg { display: block; }
  #guides { display: none; }
  body.guides #guides { display: inline; }
</style>
</head>
<body>
<svg id="art" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const params = new URLSearchParams(location.search);
const ASSET = params.get('asset') || 'header';
const SPEC = {
    // safe: Apple template "Art Safe Area" (community-measured), used for the
    // optional ?guides=1 overlay and to size the hero.
    header: { w: 3840, h: 1646, scale: 0.9,  safe: [1097, 493, 2743, 1154] },
    search: { w: 3840, h: 2560, scale: 1.4,  safe: [836, 765, 3004, 1795] },
}[ASSET];
if (params.get('guides')) document.body.classList.add('guides');

const NAVY_DEEP = '#0c0f24', NAVY = '#161b4d', NAVY_GLOW = '#26307a';
const PAPER = '#eef2ff', INK = '#121638', GREEN = '#10b981', GREEN_LIGHT = '#34d399';
const { w: W, h: H, scale: S } = SPEC;
const CX = W / 2, CY = H / 2;

// Deterministic randomness so every render is identical.
let seed = ASSET === 'header' ? 7 : 11;
const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

function ticketPath(w, h) {
    const r = h * 0.16, n = h * 0.16;
    return `M${r},0 H${w - r} A${r},${r} 0 0 1 ${w},${r} V${h / 2 - n} A${n},${n} 0 0 0 ${w},${h / 2 + n}
            V${h - r} A${r},${r} 0 0 1 ${w - r},${h} H${r} A${r},${r} 0 0 1 0,${h - r}
            V${h / 2 + n} A${n},${n} 0 0 0 0,${h / 2 - n} V${r} A${r},${r} 0 0 1 ${r},0 Z`;
}

// A plausible-looking QR code: three finder patterns plus seeded modules.
function qr(size, n = 25) {
    const m = size / n, out = [];
    const finder = (x, y) => {
        out.push(`<rect x="${x * m}" y="${y * m}" width="${7 * m}" height="${7 * m}" rx="${m * 1.2}" fill="${INK}"/>`);
        out.push(`<rect x="${(x + 1) * m}" y="${(y + 1) * m}" width="${5 * m}" height="${5 * m}" rx="${m * 0.8}" fill="${PAPER}"/>`);
        out.push(`<rect x="${(x + 2) * m}" y="${(y + 2) * m}" width="${3 * m}" height="${3 * m}" rx="${m * 0.6}" fill="${INK}"/>`);
    };
    const inFinder = (i, j) => (i < 8 && j < 8) || (i >= n - 8 && j < 8) || (i < 8 && j >= n - 8);
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
        if (inFinder(i, j) || rand() < 0.52) continue;
        out.push(`<rect x="${i * m + m * 0.06}" y="${j * m + m * 0.06}" width="${m * 0.88}" height="${m * 0.88}" rx="${m * 0.22}" fill="${INK}"/>`);
    }
    finder(0, 0); finder(n - 7, 0); finder(0, n - 7);
    return out.join('');
}

function hero() {
    const tw = 1120 * S, th = 540 * S;
    const stub = tw * 0.36;
    const qrSize = th * 0.6;
    const pad = 70 * S, arm = 120 * S, sw = 16 * S;
    const bx0 = -tw / 2 - pad, by0 = -th / 2 - pad, bx1 = tw / 2 + pad, by1 = th / 2 + pad;
    const corner = (x, y, sx, sy) =>
        `<path d="M${x},${y + sy * arm} V${y + sy * 18 * S} Q${x},${y} ${x + sx * 18 * S},${y} H${x + sx * arm}" />`;
    const scanY = th * 0.08;
    const badgeR = 118 * S;
    return `
    <g transform="translate(${CX},${CY})">
      <ellipse cx="0" cy="${th * 0.62}" rx="${tw * 0.62}" ry="${th * 0.22}" fill="${GREEN}" opacity="0.22" filter="url(#blurGlow)"/>
      <g fill="none" stroke="${GREEN_LIGHT}" stroke-width="${sw}" stroke-linecap="round" filter="url(#softGlow)">
        ${corner(bx0, by0, 1, 1)}${corner(bx1, by0, -1, 1)}${corner(bx0, by1, 1, -1)}${corner(bx1, by1, -1, -1)}
      </g>
      <g>
        <g transform="translate(${-tw / 2},${-th / 2})" filter="url(#ticketShadow)">
          <path d="${ticketPath(tw, th)}" fill="${PAPER}"/>
          <line x1="${stub}" y1="${th * 0.12}" x2="${stub}" y2="${th * 0.88}" stroke="${INK}" stroke-width="${th * 0.028}" stroke-dasharray="${th * 0.065} ${th * 0.055}" stroke-linecap="butt"/>
          <g transform="translate(${(stub - qrSize) / 2 + th * 0.02},${(th - qrSize) / 2})">${qr(qrSize)}</g>
          <rect x="${stub + tw * 0.07}" y="${th * 0.27}" width="${tw * 0.4}" height="${th * 0.1}" rx="${th * 0.05}" fill="${INK}"/>
          <rect x="${stub + tw * 0.07}" y="${th * 0.46}" width="${tw * 0.3}" height="${th * 0.06}" rx="${th * 0.03}" fill="${INK}" opacity="0.35"/>
          <rect x="${stub + tw * 0.07}" y="${th * 0.58}" width="${tw * 0.22}" height="${th * 0.06}" rx="${th * 0.03}" fill="${INK}" opacity="0.35"/>
          <rect x="${stub + tw * 0.07}" y="${th * 0.72}" width="${tw * 0.14}" height="${th * 0.075}" rx="${th * 0.0375}" fill="${GREEN}"/>
        </g>
      </g>
      <g filter="url(#softGlow)">
        <rect x="${bx0 + 10 * S}" y="${scanY - 30 * S}" width="${bx1 - bx0 - 20 * S}" height="${60 * S}" fill="url(#scanBand)" opacity="0.55"/>
        <rect x="${bx0 + 10 * S}" y="${scanY - 4 * S}" width="${bx1 - bx0 - 20 * S}" height="${8 * S}" rx="${4 * S}" fill="url(#scanLine)"/>
      </g>
      <g transform="translate(${tw / 2 - 90 * S},${-th / 2 + 70 * S})">
        <circle r="${badgeR + 34 * S}" fill="${GREEN}" opacity="0.18"/>
        <circle r="${badgeR}" fill="${GREEN}" filter="url(#badgeShadow)"/>
        <path d="M${-badgeR * 0.42},${badgeR * 0.02} L${-badgeR * 0.12},${badgeR * 0.32} L${badgeR * 0.45},${-badgeR * 0.3}"
              fill="none" stroke="#ffffff" stroke-width="${badgeR * 0.17}" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>`;
}

const [gx0, gy0, gx1, gy1] = SPEC.safe;
const svg = document.getElementById('art');
svg.setAttribute('width', W);
svg.setAttribute('height', H);
svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
svg.innerHTML = `
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="75%">
      <stop offset="0" stop-color="${NAVY_GLOW}"/>
      <stop offset="0.45" stop-color="${NAVY}"/>
      <stop offset="1" stop-color="${NAVY_DEEP}"/>
    </radialGradient>
    <linearGradient id="scanLine" x1="0" x2="1">
      <stop offset="0" stop-color="${GREEN_LIGHT}" stop-opacity="0"/>
      <stop offset="0.15" stop-color="${GREEN_LIGHT}"/>
      <stop offset="0.85" stop-color="${GREEN_LIGHT}"/>
      <stop offset="1" stop-color="${GREEN_LIGHT}" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scanBand" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="${GREEN_LIGHT}" stop-opacity="0"/>
      <stop offset="0.5" stop-color="${GREEN_LIGHT}" stop-opacity="0.5"/>
      <stop offset="1" stop-color="${GREEN_LIGHT}" stop-opacity="0"/>
    </linearGradient>
    <filter id="blurGlow" x="-50%" y="-100%" width="200%" height="300%"><feGaussianBlur stdDeviation="${90 * S}"/></filter>
    <filter id="softGlow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="${10 * S}" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ticketShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="${30 * S}" stdDeviation="${40 * S}" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="badgeShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="${12 * S}" stdDeviation="${18 * S}" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="${W}" height="${H}" fill="url(#bg)"/>
  ${hero()}
  <g id="guides" fill="none" stroke="#ff3b30" stroke-width="6" stroke-dasharray="30 20">
    <rect x="${gx0}" y="${gy0}" width="${gx1 - gx0}" height="${gy1 - gy0}"/>
  </g>`;
</script>
</body>
</html>
