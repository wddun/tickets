<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <title>Your Ticket | WTS Tickets</title>
    <meta name="theme-color" content="#1a1f3c">
    <script>
    (function(){
      var saved = localStorage.getItem('wts-theme');
      document.documentElement.setAttribute('data-theme', saved || 'light');
    })();
    </script>
    <link rel="stylesheet" href="style.css">
    <style>
        :root, [data-theme="light"] { --badge-bg: #f0f1f7; }
        [data-theme="dark"]         { --badge-bg: #252b52; }

        body { justify-content: flex-start; background: var(--bg); }
        .page-nav {
            background: var(--navy); padding: 0 20px; height: 52px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .page-nav img { height: 24px; }
        .page-nav a { font-size: 13px; color: rgba(255,255,255,.6); font-weight: 500; text-decoration: none; }
        .page-nav a:hover { color: #fff; }

        .wrap { width: 100%; max-width: 560px; margin: 0 auto; padding: 28px 16px 40px; }
        .panel {
            background: var(--card); border: 1px solid var(--border); border-radius: 14px;
            box-shadow: var(--shadow); padding: 28px 24px; text-align: center;
        }
        .desc { font-size: 14px; color: var(--text-muted); line-height: 1.6; }

        .reg {
            background: var(--card); border: 1px solid var(--border); border-radius: 14px;
            box-shadow: var(--shadow); overflow: hidden;
        }
        .reg-stripe { height: 6px; }
        .reg-banner { width: 100%; max-height: 180px; object-fit: cover; display: block; }
        .reg-body { padding: 20px 18px 18px; }
        .reg-name { font-size: 20px; font-weight: 800; color: var(--text); margin-bottom: 4px; word-break: break-word; }
        .reg-meta { font-size: 14px; color: var(--text-muted); line-height: 1.55; }
        .reg-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; align-items: center; justify-content: center; }
        .wallet-link { display: inline-block; line-height: 0; }
        .wallet-link img { height: 40px; width: auto; display: block; }
        .small-btn {
            display: inline-flex; align-items: center; gap: 6px; width: auto;
            padding: 9px 14px; min-height: 0; font-size: 13px; font-weight: 600;
            border-radius: 9px; border: 1px solid var(--border);
            background: var(--card); color: var(--text); cursor: pointer; text-decoration: none;
        }
        .small-btn svg { width: 15px; height: 15px; flex-shrink: 0; }

        .tickets { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-top: 16px; }
        .ticket { border: 1px solid var(--border); border-radius: 12px; padding: 16px; text-align: center; background: var(--bg); }
        .ticket.inactive { opacity: .6; }
        .ticket-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--text-muted); margin-bottom: 4px; }
        .ticket-name { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 10px; word-break: break-word; }
        /* White behind the QR in dark mode too: scanners need the contrast. */
        .ticket-qr { width: 200px; height: 200px; max-width: 100%; display: block; margin: 0 auto; background: #fff; border-radius: 8px; padding: 8px; }
        .ticket-token { font-family: monospace; font-size: 11px; color: var(--text-muted); margin-top: 8px; word-break: break-all; }
        .ticket-tag {
            display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .4px;
            text-transform: uppercase; padding: 3px 8px; border-radius: 99px;
            background: var(--badge-bg); color: var(--text-muted); margin-top: 8px;
        }
        .ticket-void { font-size: 13px; color: var(--text-muted); padding: 30px 0; }
        .footer-note { margin-top: 22px; font-size: 12px; color: var(--text-muted); text-align: center; line-height: 1.6; }
        .footer-note a { color: var(--text-muted); }

        @media print {
            body { background: #fff !important; }
            .page-nav, .reg-actions, .footer-note { display: none !important; }
            .reg { box-shadow: none; border: 1px solid #ccc; }
            .ticket { background: #fff !important; break-inside: avoid; }
            .ticket.inactive { display: none; }
        }
    </style>
</head>
<body>
    <nav class="page-nav">
        <a href="/"><img src="/logo-nav.svg" alt="Will's Tech Support"></a>
        <a href="/my-tickets.html">My Tickets</a>
    </nav>

    <div class="wrap">
        <div id="statusView" class="panel"><div class="desc" id="statusText">Loading your ticket&hellip;</div></div>
        <div id="ticketView" style="display:none;"></div>
        <div class="footer-note">Show this QR code at the door. Lost this link? <a href="/my-tickets.html">See all your tickets</a> by email.</div>
    </div>

    <script>
        function esc(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }
        function showStatus(text) {
            document.getElementById('statusText').textContent = text;
            document.getElementById('statusView').style.display = 'block';
            document.getElementById('ticketView').style.display = 'none';
        }

        const ICON_PRINT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>';

        function ticketHtml(t, i, n) {
            const tag = t.returned ? 'Returned' : (t.expired ? 'No longer valid' : (t.checkedIn ? 'Checked in' : ''));
            const body = t.token
                ? `<img class="ticket-qr" src="/qr/${encodeURIComponent(t.token)}" alt="QR code for ${esc(t.name || 'ticket')}" width="200" height="200">
                   <div class="ticket-token">${esc(t.token)}</div>`
                : `<div class="ticket-void">This ticket can no longer be used.</div>`;
            return `<div class="ticket${t.token ? '' : ' inactive'}">
                <div class="ticket-label">${n > 1 ? `Ticket ${i + 1} of ${n}` : 'Ticket'}</div>
                <div class="ticket-name">${esc(t.name || 'Ticket')}</div>
                ${body}
                ${tag ? `<div class="ticket-tag">${esc(tag)}</div>` : ''}
            </div>`;
        }

        async function load() {
            const token = new URLSearchParams(location.search).get('t');
            if (!token) return showStatus('This ticket link is incomplete. Check the text or email you received.');
            let res;
            try { res = await fetch(`/api/ticket/${encodeURIComponent(token)}`); }
            catch { return showStatus('Connection error. Check your signal and reload.'); }
            if (res.status === 404) return showStatus('We could not find this ticket. It may have been removed by the organizer.');
            if (!res.ok) return showStatus('Something went wrong loading your ticket. Please reload.');
            const d = await res.json();

            const valid = d.tickets.filter(t => t.token);
            const walletHref = valid.length === 1
                ? `/api/pass/${encodeURIComponent(valid[0].token)}.pkpass`
                : (d.registrationId ? `/api/passes/bundle/${encodeURIComponent(d.registrationId)}` : '');
            const meta = [d.event.when, d.event.location].filter(Boolean).map(esc).join('<br>');
            document.getElementById('ticketView').innerHTML = `<div class="reg">
                <div class="reg-stripe" style="background:${esc(d.event.color || '#6366f1')};"></div>
                ${d.event.imageUrl ? `<img class="reg-banner" src="${esc(d.event.imageUrl)}" alt="">` : ''}
                <div class="reg-body">
                    <div class="reg-name">${esc(d.event.name || 'Event')}</div>
                    ${meta ? `<div class="reg-meta">${meta}</div>` : ''}
                    <div class="tickets">${d.tickets.map((t, i) => ticketHtml(t, i, d.tickets.length)).join('')}</div>
                    ${valid.length ? `<div class="reg-actions">
                        ${d.walletAvailable && walletHref && valid.length === d.tickets.length ? `<a class="wallet-link" href="${walletHref}"><img src="/apple-wallet-badge.png" alt="Add to Apple Wallet"></a>` : ''}
                        <button type="button" class="small-btn" onclick="window.print()">${ICON_PRINT}Print</button>
                    </div>` : ''}
                </div>
            </div>`;
            document.title = `Your Ticket | ${d.event.name || 'WTS Tickets'}`;
            document.getElementById('statusView').style.display = 'none';
            document.getElementById('ticketView').style.display = 'block';
        }
        load();
    </script>
</body>
</html>
