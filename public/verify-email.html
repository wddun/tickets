<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email | WTS Tickets</title>
    <meta name="theme-color" content="#1a1f3c">
    <script>
    (function(){
      var saved = localStorage.getItem('wts-theme');
      var theme = saved || 'light'; // default light regardless of OS preference; only an explicit toggle changes it
      document.documentElement.setAttribute('data-theme', theme);
    })();
    </script>
    <link rel="stylesheet" href="style.css">
    <style>
        body { justify-content: flex-start; background: var(--bg); }
        .page-nav {
            background: var(--navy);
            padding: 0 20px; height: 52px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .page-nav img { height: 24px; width: auto; }
        .auth-wrap {
            flex: 1; display: flex;
            align-items: flex-start; justify-content: center;
            padding: 40px 16px;
        }
        .auth-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: var(--shadow);
            padding: 40px 32px;
            width: 100%; max-width: 400px;
            text-align: center;
        }
        .icon { font-size: 52px; margin-bottom: 18px; }
        .card-title { font-size: 22px; font-weight: 800; color: var(--text); margin-bottom: 10px; }
        .card-desc  { font-size: 15px; color: var(--text-muted); line-height: 1.6; margin-bottom: 28px; }
        .btn-primary {
            display: inline-block; background: var(--navy); color: #fff;
            text-decoration: none; font-size: 15px; font-weight: 700;
            padding: 13px 32px; border-radius: 10px; width: 100%;
            box-sizing: border-box; border: none; cursor: pointer;
        }
        .btn-primary:hover { background: var(--navy-dark); }
        /* --navy and --card are the same color in dark mode, so a plain-navy
           button on the card would have no visible edge. */
        [data-theme="dark"] .btn-primary { background: var(--navy-mid); }
        [data-theme="dark"] .btn-primary:hover { background: #2f3768; }
        .spinner {
            width: 36px; height: 36px; border: 3px solid var(--border);
            border-top-color: var(--red); border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <nav class="page-nav">
        <a href="/"><img src="/logo-nav.svg" alt="Will's Tech Support"></a>
        <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
    </nav>
    <div class="auth-wrap">
        <div class="auth-card" id="card">
            <div class="spinner" id="spinner"></div>
            <div class="card-title">Verifying your email…</div>
            <div class="card-desc">Just a moment.</div>
        </div>
    </div>

    <script>
        (function(){
            var btn = document.getElementById('theme-toggle');
            function paint(){ btn.innerHTML = document.documentElement.getAttribute('data-theme') === 'dark' ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>' : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>'; }
            paint();
            btn.addEventListener('click', function(){
                var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', next);
                localStorage.setItem('wts-theme', next);
                paint();
            });
        })();
        const token = new URLSearchParams(window.location.search).get('token');
        const card  = document.getElementById('card');

        async function verify() {
            if (!token) {
                showError('Invalid link', 'This verification link is missing a token. Please check your email and try again.');
                return;
            }
            try {
                const r    = await fetch(`/api/auth/verify/${encodeURIComponent(token)}`);
                const data = await r.json();
                if (data.success) {
                    card.innerHTML = `
                        <div class="icon">✅</div>
                        <div class="card-title">Email verified!</div>
                        <div class="card-desc">Your account is active. Taking you to the dashboard…</div>
                        <a href="/dashboard.html" class="btn-primary">Go to Dashboard</a>`;
                    setTimeout(() => window.location.href = '/dashboard.html', 2000);
                } else {
                    showError('Link expired or invalid', data.error || 'This verification link has already been used or has expired.');
                }
            } catch {
                showError('Connection error', 'Could not reach the server. Please try again.');
            }
        }

        function showError(title, desc) {
            card.innerHTML = `
                <div class="icon">⚠️</div>
                <div class="card-title">${title}</div>
                <div class="card-desc">${desc}</div>
                <a href="/login.html" class="btn-primary">Back to Login</a>`;
        }

        verify();
    </script>
</body>
</html>
