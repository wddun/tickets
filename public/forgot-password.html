<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | WTS Tickets</title>
    <meta name="theme-color" content="#1a1f3c">
    <script>
    (function(){
      var saved = localStorage.getItem('wts-theme');
      var theme = saved || 'light'; // default light regardless of OS preference; only an explicit toggle changes it
      document.documentElement.setAttribute('data-theme', theme);
    })();
    </script>
    <link rel="stylesheet" href="style.css">
    <style>
        body { justify-content: flex-start; background: var(--bg); }
        .page-nav {
            background: var(--navy); padding: 0 20px; height: 52px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .page-nav img { height: 24px; }
        .page-nav a { font-size: 13px; color: rgba(255,255,255,.6); font-weight: 500; text-decoration: none; }
        .page-nav a:hover { color: #fff; }
        .auth-wrap {
            flex: 1; display: flex; align-items: flex-start;
            justify-content: center; padding: 32px 16px 40px;
        }
        .auth-card {
            background: var(--card); border: 1px solid var(--border); border-radius: 14px;
            box-shadow: var(--shadow); padding: 32px 28px;
            width: 100%; max-width: 400px;
        }
        @media (max-width:480px) { .auth-card { padding: 24px 18px; } }
        .auth-logo { text-align: center; margin-bottom: 24px; }
        .auth-logo img { height: 32px; }
        .auth-title { font-size: 20px; font-weight: 800; color: var(--text); margin-bottom: 6px; }
        .auth-desc  { font-size: 14px; color: var(--text-muted); line-height: 1.6; margin-bottom: 24px; }
        .sent-icon  { font-size: 44px; text-align: center; margin-bottom: 16px; }
        .footer-note { margin-top: 20px; font-size: 11px; color: var(--text-muted); text-align: center; }
        .footer-note a { color: var(--text-muted); }
    </style>
</head>
<body>
    <nav class="page-nav">
        <a href="/"><img src="/logo-nav.svg" alt="Will's Tech Support"></a>
        <div style="display:flex;align-items:center;gap:14px;">
            <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">🌙</button>
            <a href="/login.html">← Back to Login</a>
        </div>
    </nav>
    <div class="auth-wrap">
        <div class="auth-card">
            <div class="auth-logo">
                <img class="logo-swap-light" src="/logo-nav-dark.svg" alt="Will's Tech Support">
                <img class="logo-swap-dark" src="/logo-nav.svg" alt="Will's Tech Support">
            </div>

            <div id="formState">
                <div class="auth-title">Forgot your password?</div>
                <div class="auth-desc">Enter your email and we'll send you a link to reset it.</div>
                <form id="forgotForm">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="organizer@example.com" required autocomplete="email">
                    </div>
                    <button type="submit" id="submitBtn">Send Reset Link</button>
                </form>
            </div>

            <div id="sentState" style="display:none; text-align:center;">
                <div class="sent-icon">📬</div>
                <div class="auth-title">Check your email</div>
                <div class="auth-desc">
                    If an account exists for that address, we've sent a password reset link. It expires in 1 hour.
                </div>
                <a href="/login.html" style="display:block;margin-top:4px;color:var(--red);font-weight:600;font-size:14px;text-decoration:none;">← Back to Login</a>
            </div>

            <div class="footer-note">
                © Will's Tech Support &nbsp;·&nbsp;
                <a href="mailto:support@willstechsupport.com">support@willstechsupport.com</a>
            </div>
        </div>
    </div>

    <script>
        (function(){
            var btn = document.getElementById('theme-toggle');
            function paint(){ btn.textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙'; }
            paint();
            btn.addEventListener('click', function(){
                var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', next);
                localStorage.setItem('wts-theme', next);
                paint();
            });
        })();
        document.getElementById('forgotForm').onsubmit = async e => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = 'Sending…';
            try {
                await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: document.getElementById('email').value })
                });
            } catch {}
            // Always show sent — don't leak whether the account exists
            document.getElementById('formState').style.display = 'none';
            document.getElementById('sentState').style.display = 'block';
        };
    </script>
</body>
</html>
